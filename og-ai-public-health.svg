<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d6b"/>
      <stop offset="0.55" stop-color="#103f72"/>
      <stop offset="1" stop-color="#0a2c50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7fa3"/>
      <stop offset="1" stop-color="#3aa7c4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- faint ECG / surveillance pulse -->
  <polyline points="0,470 260,470 300,470 330,410 360,530 392,470 470,470 520,470 555,300 590,470 720,470 770,470 805,430 835,510 865,470 1200,470"
            fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="3"/>

  <!-- left accent bar -->
  <rect x="90" y="150" width="6" height="330" rx="3" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="120" y="176" font-family="DejaVu Sans Mono, monospace" font-size="22" letter-spacing="3" fill="#57c4de">DAILY DIGEST · PART 03 · NEWS</text>

  <!-- headline -->
  <text x="118" y="286" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-weight="bold" font-size="104" fill="#ffffff">AI for Public Health</text>

  <!-- subhead -->
  <text x="120" y="352" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="37" fill="#c7dcef">How AI watches for outbreaks, forecasts</text>
  <text x="120" y="400" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="37" fill="#c7dcef">epidemics and reaches hospitals — daily.</text>

  <!-- topic chips -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="21" fill="#0b3d6b">
    <rect x="120" y="436" width="184" height="42" rx="21" fill="#8fd0e4"/>
    <text x="140" y="464">Surveillance</text>
    <rect x="318" y="436" width="168" height="42" rx="21" fill="#8fd0e4"/>
    <text x="338" y="464">Forecasting</text>
    <rect x="500" y="436" width="132" height="42" rx="21" fill="#8fd0e4"/>
    <text x="520" y="464">Sepsis AI</text>
    <rect x="646" y="436" width="150" height="42" rx="21" fill="#8fd0e4"/>
    <text x="666" y="464">Health Data</text>
  </g>

  <!-- footer band -->
  <rect x="0" y="558" width="1200" height="72" fill="#08243f"/>
  <text x="120" y="602" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="26" fill="#eaf2fb" font-weight="bold">Key takeaways · updated every morning</text>
  <text x="1080" y="602" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#57c4de">lakeslinked.com</text>
</svg>
